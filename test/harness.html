<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Opening Scenes — harness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="mirror/scripts/extensions/third-party/st-opening-scenes/style.css">
    <style>
        :root {
            --SmartThemeBodyColor: rgba(255, 255, 255, 0.88);
            --SmartThemeEmColor: #9ec9ff;
            --SmartThemeQuoteColor: #9ec9ff;
            --SmartThemeUnderlineColor: rgba(255, 255, 255, 0.5);
            --SmartThemeBorderColor: rgba(255, 255, 255, 0.22);
            --SmartThemeBlurTintColor: rgba(19, 21, 27, 0.93);
            --SmartThemeBlurStrength: 10px;
            --SmartThemeShadowColor: rgba(0, 0, 0, 0.45);
            --SmartThemeChatTintColor: rgba(0, 0, 0, 0.25);
            --SmartThemeUserMesBlurTintColor: rgba(60, 70, 100, 0.35);
            --SmartThemeBotMesBlurTintColor: rgba(30, 32, 40, 0.35);
            --SmartThemeFastUIBGColor: rgba(0, 0, 0, 0.35);
            --mainFontSize: 15px;
            --mainFontFamily: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: radial-gradient(120% 80% at 70% 0%, #1d2331 0%, #12141a 55%, #0c0d11 100%);
            color: var(--SmartThemeBodyColor);
            font-family: var(--mainFontFamily);
            font-size: var(--mainFontSize);
            overflow: hidden;
        }

        .harness-chat {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px;
            opacity: 0.35;
            filter: blur(1px);
        }

        .harness-msg {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            line-height: 1.5;
            font-size: 14px;
        }

        /* --- the parts of SillyTavern's shell the extension relies on ------ */

        dialog.popup {
            position: fixed;
            inset: 0;
            margin: auto;
            border: none;
            padding: 0;
            background: transparent;
            color: var(--SmartThemeBodyColor);
            font-family: var(--mainFontFamily);
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        dialog.popup::backdrop {
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(2px);
        }

        .popup-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .popup-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
        }

        .popup-controls {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 10px;
        }

        .popup-button-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            cursor: pointer;
            opacity: 0.55;
            border-radius: 8px;
            z-index: 5;
        }

        .popup-button-close:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.08);
        }

        .menu_button {
            cursor: pointer;
        }

        #extensionsMenu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px;
            width: 210px;
            border: 1px solid var(--SmartThemeBorderColor);
            border-radius: 10px;
            background: var(--SmartThemeBlurTintColor);
            backdrop-filter: blur(10px);
        }

        #extensionsMenu > div {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 5px;
            cursor: pointer;
            opacity: 0.6;
        }

        #extensionsMenu > div:hover {
            opacity: 1;
        }

        .extensionsMenuExtensionButton {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        #devbar {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 50;
            display: flex;
            gap: 8px;
        }

        #devbar button {
            font: inherit;
            font-size: 12px;
            padding: 7px 11px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.55);
            color: inherit;
            cursor: pointer;
        }

        #toasts {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .toast {
            max-width: 340px;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 12.5px;
            background: rgba(20, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.9);
        }

        .toast.success { border-color: rgba(120, 220, 150, 0.5); }
        .toast.error { border-color: rgba(224, 87, 91, 0.6); }

        /* --- mock of ST's character edit panel ---------------------------- */

        #editor-mock {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 40;
            width: 300px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(16, 18, 23, 0.92);
            backdrop-filter: blur(8px);
        }

        .editor-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .editor-avatar {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(158, 201, 255, 0.18);
            font-weight: 600;
        }

        .editor-name {
            font-size: 16px;
            font-weight: 600;
        }

        .buttons_block {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .menu_button {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            cursor: pointer;
            opacity: 0.8;
        }

        .menu_button:hover {
            opacity: 1;
            border-color: rgba(158, 201, 255, 0.5);
        }

        .editor-hint {
            margin-top: 9px;
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.35;
        }
    </style>
</head>

<body>
    <div class="harness-chat">
        <div class="harness-msg"><em>The elevator doors open onto a floor that smells of rain and old
                paper.</em><br><br>“You’re late,” Aria says, without looking up from the window.</div>
        <div class="harness-msg">“I was starting to think I imagined the application.”</div>
    </div>

    <!-- Mock of ST's character edit panel, so the injected button can be seen in context -->
    <div id="editor-mock">
        <div class="editor-head">
            <span class="editor-avatar">A</span>
            <span class="editor-name">Aria Voss</span>
        </div>
        <form id="form_create" actiontype="editcharacter">
            <div class="form_create_bottom_buttons_block buttons_block">
                <div class="menu_button fa-solid fa-left-long" title="Back"></div>
                <div class="menu_button fa-solid fa-star" title="Favorite"></div>
                <div id="advanced_div" class="menu_button fa-solid fa-book" title="Advanced Definitions"></div>
                <div class="menu_button fa-solid fa-globe" title="Lorebook"></div>
                <div class="menu_button fa-solid fa-face-smile" title="Connected Personas"></div>
                <div class="menu_button fa-solid fa-file-export" title="Export"></div>
                <div class="menu_button fa-solid fa-clone" title="Duplicate"></div>
                <div class="menu_button fa-solid fa-skull red_button" title="Delete"></div>
            </div>
        </form>
        <div class="editor-hint">character edit panel (mock)</div>
    </div>

    <div id="devbar"></div>
    <div id="toasts"></div>
    <div id="extensions_settings"></div>

    <script>
        window.toastr = {
            _add(text, className) {
                const el = document.createElement('div');
                el.className = `toast ${className}`;
                el.textContent = String(text ?? '');
                document.getElementById('toasts').append(el);
                setTimeout(() => el.remove(), 4200);
            },
            info(text) { this._add(text, 'info'); },
            success(text) { this._add(text, 'success'); },
            warning(text) { this._add(text, 'warning'); },
            error(text) { this._add(text, 'error'); },
        };

        window.jQuery = function (callback) {
            Promise.resolve().then(callback);
            return { append() { }, on() { } };
        };
        window.$ = window.jQuery;

        // Mimic ST: the wand menu is injected after extensions load.
        setTimeout(() => {
            const menu = document.createElement('div');
            menu.id = 'extensionsMenu';
            menu.innerHTML = '<div><div class="extensionsMenuExtensionButton fa-solid fa-paperclip"></div><span>Attach File</span></div>';
            const bar = document.getElementById('devbar');
            bar.append(menu);
        }, 350);
    </script>

    <script type="module">
        import './mirror/scripts/extensions/third-party/st-opening-scenes/index.js';
    </script>
</body>

</html>
